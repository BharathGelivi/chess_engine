[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "engine_bin"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# SmallRng is seeded deterministically (see movegen.rs build_magics) so no OS
# entropy source is needed — default-features=false keeps getrandom out of
# the dependency tree entirely (avoids WASM entropy-source complications).
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
rayon = "1"
# Lazy-SMP thread pool for the WASM target only (native uses std::thread
# directly via rayon's normal pool) — wasm32 has no native threads, this
# crate spins up Web Workers backed by SharedArrayBuffer instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = "1"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1
